<?xml version="1.0" encoding="utf-8"?>
<!-- checker.svg: my own texture (Checkered_pavement_tiles.png) mapped onto a
     quad, used to demonstrate level sampling (mipmapping) in Task 6. -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 width="200.0px" height="200.0px" viewBox="0 0 200 200" enable-background="new 0 0 200 200"
	 xml:space="preserve">
<texture filename="../../img/Checkered_pavement_tiles.png" texid="map"/>
<textri texid="map" uvs="0 0 1 0 0 1" points="60 60 140 60 60 140"/>
<textri texid="map" uvs="1 0 0 1 1 1" points="140 60 60 140 140 140"/>
</svg>
